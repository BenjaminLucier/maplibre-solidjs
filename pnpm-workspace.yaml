packages:
  - site

# Versions shared by the library and the docs site.
catalog:
  "@solidjs/vite-plugin": 3.0.1
  "@solidjs/web": ^2.0.0
  maplibre-gl: ^6.0.0
  solid-js: ^2.0.0
  typescript: ^7.0.2
  vite: ^8.3.8

# These were published on 2026-11-17, inside the minimum release age, so
# pnpm needs exceptions to install them. Remove each once it is older than
# the cooldown.
minimumReleaseAgeExclude:
  - "@lucide/solid@1.74.0"
  - "@solidjs/router@2.0.0"
  - "@solidjs/signals@2.0.0"
  - "@solidjs/vite-plugin@3.0.1"
  - "@solidjs/web@2.0.0"
  - solid-js@2.0.0
  - "@solidjs/compiler-darwin-arm64@2.0.0"
  - "@solidjs/compiler-darwin-x64@2.0.0"
  - "@solidjs/compiler-linux-arm64-gnu@2.0.0"
  - "@solidjs/compiler-linux-x64-gnu@2.0.0"
  - "@solidjs/compiler-wasm32-wasi@2.0.0"
  - "@solidjs/compiler-win32-x64-msvc@2.0.0"
  - "@solidjs/compiler@2.0.0"
