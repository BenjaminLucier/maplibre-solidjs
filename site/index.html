<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="SolidJS 2 components for MapLibre GL JS: every option, event, source, layer and control as typed, reactive props."
		/>
		<title>maplibre-solidjs</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<script>
			// Set the theme before first paint, so dark mode doesn't flash.
			try {
				const stored = localStorage.getItem("theme");
				const dark =
					stored === "dark" ||
					(stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", dark);
			} catch {}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/index.tsx"></script>
	</body>
</html>
