name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so new advisories and upstream breakage surface between pushes.
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tests run in headless Chromium: MapLibre needs WebGL.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # What would ship: fails if the license files or dist are missing.
      - run: pnpm pack --dry-run

  # The oldest maplibre-gl the peer range allows, so the range can't claim
  # versions the code doesn't work with. The version comes from
  # peerDependencies, so raising the floor there moves this job too.
  maplibre-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Outside the lockfile by design: an exact version, read from this
      # repo's package.json, and old enough to clear pnpm's release-age check.
      - name: Install the oldest supported maplibre-gl
        run: | # zizmor: ignore[adhoc-packages]
          floor="$(jq -r '.peerDependencies["maplibre-gl"]' package.json)"
          floor="${floor#^}"
          pnpm add --save-dev --workspace-root "maplibre-gl@$floor"
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm typecheck
      - run: pnpm test

  # The docs site builds against the library's source, so a change that
  # breaks an example fails here rather than on deploy.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:build

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1

  # The only check the branch ruleset requires, so jobs can be added or
  # renamed without changing repository settings.
  ci:
    name: CI
    if: always()
    needs: [check, maplibre-floor, site, zizmor]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
